name: songselect-lyric-converter

networks:
  example-net:
    name: example-net
    # external: true

services:
  lyric_converter:
    container_name: songselect-lyric-converter
    image: ghcr.io/onehopeatl/songselect_lyric_converter:latest
    networks:
      - example-net
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - CCLI_LIC_NUM=abc123
      # Number of trusted reverse proxies; use 0 for direct access.
      - TRUSTED_PROXY_COUNT=1
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always
