name: Build Container and Deploy to GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: # only run when app files are changed
      - 'Dockerfile'
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/pipeline.yml'
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade --require-hashes -r app/requirements-pip.txt
      - run: python -m pip --version
      - run: python -m pip install --require-hashes -r app/requirements.txt
      - run: python -m pip check
      - run: python -W error::SyntaxWarning -m unittest discover -s tests -v
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict --disable-pip --require-hashes -r app/requirements-pip.txt -r app/requirements.txt
      - run: docker build --pull -t ohc-lyrics-check .
      - name: Test the real Gunicorn download
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=128m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges
          -v "$PWD/tests:/tests:ro" ohc-lyrics-check
          python /tests/smoke_container.py
      - name: Scan container OS and library packages
        run: |
          docker save -o "$RUNNER_TEMP/ohc-image.tar" ohc-lyrics-check
          docker run --rm -v "$RUNNER_TEMP/ohc-image.tar:/scan/image.tar:ro" docker.io/anchore/grype@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea docker-archive:/scan/image.tar --fail-on high
  build:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Calendar Version for Tagging
        id: calver
        run: |
          # YYYY.MM format
          DATE=$(date +"%Y.%m")
          # Unique build run number
          BUILD=${{ github.run_number }}
          # CALVER = YYYY.MM.bN
          # N = build number
          CALVER=$DATE.b$BUILD
          echo "Generated CalVer Tag: $CALVER"
          echo "version=$CALVER" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            APP_VERSION=${{ steps.calver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ steps.calver.outputs.version }}
