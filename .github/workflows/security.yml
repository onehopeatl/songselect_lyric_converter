name: Security and conversion checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade --require-hashes -r app/requirements-pip.txt
      - run: python -m pip --version
      - run: python -m pip install --require-hashes -r app/requirements.txt
      - run: python -m pip check
      - run: python -W error::SyntaxWarning -m unittest discover -s tests -v
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict --disable-pip --require-hashes -r app/requirements-pip.txt -r app/requirements.txt
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t ohc-lyrics-check .
      - run: docker run --rm --read-only --tmpfs /tmp:size=128m,mode=1777 --cap-drop ALL --security-opt no-new-privileges ohc-lyrics-check python -m pip check
      - name: Test the container runtime
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=128m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges
          -v "$PWD/tests:/tests:ro" ohc-lyrics-check
          python -W error::SyntaxWarning -m unittest discover -s /tests -v
      - name: Test the real Gunicorn download
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=128m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges
          -v "$PWD/tests:/tests:ro" ohc-lyrics-check
          python /tests/smoke_container.py
      - name: Scan container OS and library packages
        run: |
          docker save -o "$RUNNER_TEMP/ohc-image.tar" ohc-lyrics-check
          docker run --rm -v "$RUNNER_TEMP/ohc-image.tar:/scan/image.tar:ro" docker.io/anchore/grype@sha256:6b06708b036f74b2cd70e94b706b4586af96d1932e6ac46255940b2e39dd44a9 docker-archive:/scan/image.tar --fail-on high
  published-container:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    env:
      PUBLISHED_IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Pull and identify the published image
        run: |
          docker pull --platform "linux/${{ matrix.architecture }}" "$PUBLISHED_IMAGE"
          docker image inspect "$PUBLISHED_IMAGE" --format '{{json .RepoDigests}}'
          docker save -o "$RUNNER_TEMP/ohc-published-image.tar" "$PUBLISHED_IMAGE"
      - name: Scan published OS and library packages
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/ohc-published-image.tar:/scan/image.tar:ro"
          docker.io/anchore/grype@sha256:6b06708b036f74b2cd70e94b706b4586af96d1932e6ac46255940b2e39dd44a9
          docker-archive:/scan/image.tar --fail-on high
